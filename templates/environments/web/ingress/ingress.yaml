apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: __PROJECT__-__COMPONENT__
  labels:
    app.kubernetes.io/name: __PROJECT__-__COMPONENT__
    app.kubernetes.io/part-of: __PROJECT__
    talay.io/environment: prod
spec:
  ingressClassName: traefik
  tls:
    - secretName: __PROJECT__-__COMPONENT__-tls
      hosts:
        - __HOST__
  rules:
    - host: __HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: __PROJECT__-__COMPONENT__
                port:
                  number: 80
