name: verify-build-publish

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  java:
    uses: cantalay/talay-workflows/.github/workflows/java.yaml@__TALAY_WORKFLOWS_SHA__
    with:
      java-version: "21"
      build-tool: maven
      image-name: ghcr.io/cantalay/__IMAGE__
      push-image: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      upload-sarif: false
